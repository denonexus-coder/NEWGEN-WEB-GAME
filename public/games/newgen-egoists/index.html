<script>
const HX=51.6,HZ=34.4,GW=3.66,DUR=150,$=q=>document.querySelector(q),rnd=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const GN=['press','line','pass','shoot','drib','risk'],GL={press:'Pressão',line:'Linha alta',pass:'Passe',shoot:'Chute',drib:'Drible',risk:'Risco'};
const D=[['Leões de Aço','#e63946','#ffffff','Pressão alta',[.9,.8,.5,.5,.4,.6],[.5,.4,.7,.3]],

['Corvos Reais','#7b2cbf','#ffffff','Retranca',[.2,.15,.5,.4,.3,.2],[.3,.5,.3,.6]],
['Sol Dourado','#ffd60a','#222222','Ataque total',[.7,.9,.5,.9,.6,.8],[.6,.9,.9,.5]],
['Gelo Azul','#90e0ef','#023047','Posse',[.6,.55,.85,.35,.35,.3],[.2,.2,.8,.3]]];
function mk(d){const g={};GN.forEach((k,i)=>g[k]=d[4][i]);return{n:d[0],c1:d[1],c2:d[2],sty:d[3],g,ego:d[5][0],greed:d[5][1],amb:d[5][2],env:d[5][3],ovr:62+Math.round(rnd()*10),fm:rnd()*3|0,pts:0,pl:0,w:0,d:0,l:0,gf:0,ga:0,mo:0}}
let W;try{W=JSON.parse(localStorage.getItem('ngne2'))}catch(e){}
if(!W||!W.T)W={T:D.map(mk),me:null,rd:1,fx:[],log:['Mundo criado. Todos querem a glória.']};
function save(){try{localStorage.setItem('ngne2',JSON.stringify(W))}catch(e){}}
function newRound(){const r=(W.rd-1)%7,arr=[1,2,3,4,5,6,7],seq=[0,...arr.map((_,i)=>arr[(i-r+7)%7])];W.fx=[];for(let i=0;i<4;i++)W.fx.push({a:seq[i],b:seq[7-i],done:0});W.fx.forEach(f=>{if(f.b==W.me||(f.a!=W.me&&rnd()<.5))[f.a,f.b]=[f.b,f.a]})}
W.T.forEach(t=>{if(!t.sq)giveSquad(t)});if(!W.fx.length)newRound();
/* ---------- SIMULAÇÃO ---------- */
const FMS=[[[.03,0],[.2,-24],[.2,-8],[.2,8],[.2,24],[.42,-14],[.4,0],[.42,14],[.62,-22],[.66,0],[.62,22]],[[.03,0],[.2,-24],[.2,-8],[.2,8],[.2,24],[.42,-24],[.42,-8],[.42,8],[.42,24],[.64,-8],[.64,8]],[[.03,0],[.2,-14],[.2,0],[.2,14],[.4,-28],[.4,-12],[.38,0],[.4,12],[.4,28],[.64,-7],[.64,7]]];
function po(q){const a=q.a;return(a.spd+a.sht+a.pas+a.dri+a.def+a.stm)/6}
function ovrOf(t){return[...t.sq].map(po).sort((x,y)=>y-x).slice(0,11).reduce((x,y)=>x+y,0)/11}
function giveSquad(t){const FN=['Lucas','Mateus','Rafael','Diego','Bruno','Thiago','Caio','Pedro','Gabriel','Andre','Felipe','Renan','Igor','Davi','Hugo','Leo','Enzo','Nico','Tomas','Iago','Joao','Vitor','Ruan','Kaue'],LN=['Silva','Costa','Souza','Lima','Rocha','Nunes','Dias','Mota','Cruz','Luz','Alves','Pires','Melo','Rangel','Viana','Teles','Prado','Brito','Leal','Naves','Pinto','Ramos','Gomes','Moura'],G=['G','G','D','D','D','D','D','M','M','M','M','M','M','F','F','F','F','F'],NO=[1,12,2,3,4,5,13,6,8,14,15,16,7,9,10,11,17,18],B={G:[-10,-25,-10,-20,12,0],D:[0,-12,0,-8,12,2],M:[0,0,10,4,0,6],F:[5,12,-4,10,-14,0]},K=['spd','sht','pas','dri','def','stm'],u={};t.sq=G.map((g,i)=>{let n;do{n=FN[rnd()*FN.length|0]+' '+LN[rnd()*LN.length|0]}while(u[n]);u[n]=1;const a={};K.forEach((k,j)=>a[k]=cl(Math.round(t.ovr+B[g][j]+(rnd()-.5)*18),35,95));return{n,g,no:NO[i],a,inj:0,gl:0}});t.ovr=ovrOf(t)}
function lineup(T){T.sq.forEach(q=>q.used=0);const f=FMS[T.fm||0],st=[],av=T.sq.filter(q=>!(q.inj>0));for(let r=0;r<11;r++){const g=r==0?'G':f[r][0]<.3?'D':f[r][0]<.5?'M':'F';let b=null;for(const q of av)if(!q.used&&q.g==g&&(!b||po(q)>po(b)))b=q;if(!b)for(const q of av)if(!q.used&&q.g!='G'&&(!b||po(q)>po(b)))b=q;if(!b)b=T.sq.find(q=>!q.used)||T.sq[0];b.used=1;st[r]=b}return{st,bn:av.filter(q=>!q.used)}}
function er2(p,k){return(1.15-p.pl.a[k]/100)*.5}
function lob(S,p,tx,tz,e){const B=S.ball,dx=tx-B.x,dz=tz-B.z,L=Math.hypot(dx,dz)||1,T=cl(.55+L*.028,.7,1.9),a=Math.atan2(dz,dx)+(rnd()-.5)*e,pw=L/T*1.04;S.pk={s:p.s,bx:B.x,t:S.t,i:p.i,pos:S.P.map(o=>o.x),line:offl(S,p.s)};S.lt=p.s;B.vx=Math.cos(a)*pw;B.vz=Math.sin(a)*pw;B.vy=10*T;B.cv=(rnd()-.5)*.5;p.cd=.35;p.a=a;S.owner=-1}
function lane(S,p,m){const vx=m.x-p.x,vz=m.z-p.z,L2=vx*vx+vz*vz||1;for(const o of S.P)if(o.s!=p.s&&!o.out){const t=cl(((o.x-p.x)*vx+(o.z-p.z)*vz)/L2,0,1);if(Math.hypot(p.x+vx*t-o.x,p.z+vz*t-o.z)<2.3)return 1}return 0}
function ipt(B,p){const d=Math.hypot(B.x-p.x,B.z-p.z);let t=d/6.8;if(B.y>.8||B.vy>3)t=(B.vy+Math.sqrt(B.vy*B.vy+40*Math.max(0,B.y-.3)))/20;t=Math.min(t,2.2);return[B.x+B.vx*t*.88,B.z+B.vz*t*.88]}
function head(S,p){const B=S.ball,d=p.s?-1:1,dg=Math.abs(d*HX-p.x);p.cd=.5;p.hd=.5;S.lt=p.s;S.pk=null;if(rnd()<.15)return;S.owner=-1;const aim=(tx,tz,pw,l)=>{const a=Math.atan2(tz-p.z,tx-p.x)+(rnd()-.5)*.5;B.vx=Math.cos(a)*pw;B.vz=Math.sin(a)*pw;B.vy=l};if(dg<20&&Math.abs(p.z)<12){aim(d*HX,(rnd()<.5?-1:1)*GW*.6,16+p.pl.a.sht*.08,-1);S.st[p.s].sh++}else{const m=pick(S,p);if(m)aim(m.x,m.z,10+Math.hypot(m.x-p.x,m.z-p.z)*.4,2.5);else aim(d*HX*.6,p.z*.5,16,4)}}
function sub(S,p,force){const L=S.lu[p.s];if(S.sb[p.s]>=3&&!force){if(p.s==0)S.msg='LIMITE DE 3 SUBS';return}let best=null,bs=-1;for(const q of L.bn){if(q.used||q.inj>0)continue;if((q.g=='G')!=(p.r==0))continue;const sc=po(q)+(q.g==p.pl.g?25:0);if(sc>bs){bs=sc;best=q}}if(!best){if(force&&p.pl.inj>0)p.out=1;return}best.used=1;L.bn=L.bn.filter(q=>q!==best);const old=p.pl;p.pl=best;p.nrg=100;S.sb[p.s]++;S.msg='\ud83d\udd04 '+best.n+' \u2194 '+old.n.split(' ')[1]}
function newM(a,b,hu){const S={tm:[a,b],t:0,sc:[0,0],P:[],ball:{x:0,y:.3,z:0,vx:0,vy:0,vz:0},owner:-1,pause:1.2,hu,cp:-1,st:[0,1].map(()=>({sh:0,far:0,lo:0,cnt:0,dr:0,fl:0,cd:0})),lose:null,over:false,gm:null,gs:-1,lt:0,lu:[lineup(a),lineup(b)],sb:[0,0]};
for(let s=0;s<2;s++)for(let r=0;r<11;r++)S.P.push({i:S.P.length,s,r,pl:S.lu[s].st[r],nrg:100,x:0,z:0,vx:0,vz:0,a:s?Math.PI:0,cd:0,dash:0,sg:1});place(S);return S}
function place(S){S.P.forEach(p=>{if(p.out)return;const f=FMS[S.tm[p.s].fm||0][p.r],d=p.s?-1:1;p.x=d*(-HX+Math.min(f[0],.47)*2*HX);p.z=f[1];p.vx=p.vz=0;p.a=p.s?Math.PI:0;p.dash=0});Object.assign(S.ball,{x:0,y:.3,z:0,vx:0,vy:0,vz:0});S.owner=-1;S.lose=null;S.gs=-1;S.rs=null;S.pk=null}
const er=T=>(1.15-T.ovr/100)*.5;
function kick(S,p,tx,tz,pw,lift,e){const B=S.ball;S.pk={s:p.s,bx:B.x,t:S.t,i:p.i,pos:S.P.map(o=>o.x),line:offl(S,p.s)};S.lt=p.s;const a=Math.atan2(tz-B.z,tx-B.x)+(rnd()-.5)*e;B.vx=Math.cos(a)*pw;B.vz=Math.sin(a)*pw;B.vy=lift;B.cv=(rnd()-.5)*.3;p.cd=.3;p.a=a;S.owner=-1}
function pick(S,p){const T=S.tm[p.s],d=p.s?-1:1;let b=null,bs=-1e9;for(const m of S.P){if(m.s!=p.s||m===p||m.r==0)continue;const dist=Math.hypot(m.x-p.x,m.z-p.z);if(dist<2.5)continue;let op=1e9;for(const o of S.P)if(o.s!=p.s)op=Math.min(op,Math.hypot(o.x-m.x,o.z-m.z));let ln=1e9;const vx=m.x-p.x,vz=m.z-p.z;for(const o of S.P)if(o.s!=p.s){const t=cl(((o.x-p.x)*vx+(o.z-p.z)*vz)/(vx*vx+vz*vz),0,1);ln=Math.min(ln,Math.hypot(p.x+vx*t-o.x,p.z+vz*t-o.z))}const sc=(m.x-p.x)*d*T.g.risk*.9+Math.min(op,8)*1.6-dist*.25+Math.min(ln,5)*2.2;if(sc>bs){bs=sc;b=m}}return b}
function skill(p,sgn){p.dash=.35;p.sg=sgn||-p.sg;p.sf=1;p.sk=1+(rnd()*3|0);p.a+=p.sg*[.8,1.3,.6][p.sk-1];const v=[9,8,11][p.sk-1];p.vx=Math.cos(p.a)*v;p.vz=Math.sin(p.a)*v}
function mv(p,tx,tz,sp,dt,T){if(p.dash>0)return;let dx=tx-p.x,dz=tz-p.z;const l=Math.hypot(dx,dz),mx=(6+p.pl.a.spd*.026)*(.7+.3*p.nrg/100)*(p.stun>0?.35:1)*sp*(1+T.amb*.05);if(l>.3){dx/=l;dz/=l}else dx=dz=0;const k=Math.min(1,7*dt);p.vx+=(dx*mx-p.vx)*k;p.vz+=(dz*mx-p.vz)*k;if(Math.hypot(p.vx,p.vz)>.8)p.a=Math.atan2(p.vz,p.vx)}
function ai(S,p,dt){const T=S.tm[p.s],g=T.g,d=p.s?-1:1,B=S.ball,P=S.P,ow=S.owner>=0?P[S.owner]:null,mine=ow&&ow.s==p.s,me=ow===p,gx=d*HX,f=FMS[T.fm||0][p.r];
const push=S.sc[p.s]<S.sc[1-p.s]?T.amb*.25*(S.t/DUR):0;let tx,tz,sp=1;if(S.rs){const RS=S.rs;if(p.i==RS.k&&RS.type!='pen'){mv(p,RS.x,RS.z,1,dt,T);return}if(p.r&&p.i!=RS.k){if(RS.type=='pen'){mv(p,(RS.s?-1:1)*(HX-24),p.z,1,dt,T);return}if(RS.type=='cor'){const a=RS.s?-1:1;mv(p,a*(HX-(p.s==RS.s?10:6)),((p.i%6)-2.5)*3.2,1,dt,T);return}if(p.s==RS.s){mv(p,d*(-HX+cl(f[0]+.15,0,.9)*2*HX),f[1]+RS.z*.3,.9,dt,T);return}const dx=p.x-RS.x,dz=p.z-RS.z,l=Math.hypot(dx,dz)||1;if(l<8.5){mv(p,RS.x+dx/l*9,RS.z+dz/l*9,1,dt,T);return}}}
if(p.r==0){const gn=-d*(HX-1.4),dist=Math.hypot(B.x-p.x,B.z-p.z);if(me){const m=pick(S,p);kick(S,p,m?m.x:0,m?m.z:0,15,1.5,er(T));return}
if(!mine&&dist<10&&Math.abs(B.x-gn)<14){tx=B.x;tz=B.z}else{tx=gn;tz=cl(B.z*.3,-2.6,2.6)}mv(p,tx,tz,1,dt,T);return}
if(!ow&&S.pk&&S.pk.rc==p.i&&S.pk.s==p.s&&S.t-S.pk.t<2.6){const q=ipt(B,p);mv(p,q[0],q[1],1,dt,T);return}
if(me){const dg=Math.abs(gx-p.x),rng=10+(g.shoot+T.ego*.25+T.greed*.2)*24;let near=1e9,no=null;for(const o of P)if(o.s!=p.s){const dd=Math.hypot(o.x-p.x,o.z-p.z);if(dd<near){near=dd;no=o}}
if(dg<rng&&Math.abs(p.z)<HZ-3&&rnd()<4*dt*(.5+g.shoot)){const gk=P.find(o=>o.s!=p.s&&o.r==0),az=(gk&&gk.z>0?-1:1)*(GW*(.62+rnd()*.28));kick(S,p,gx,az,26+p.pl.a.sht*.08,.6+rnd()*1.2,er2(p,'sht'));const st=S.st[p.s];st.sh++;if(dg>26)st.far++;return}
if(p.r&&Math.abs(p.z)>HZ-14&&d*p.x>HX-34&&rnd()<2.4*dt){const fo=P.filter(o=>o.s==p.s&&o.r&&d*o.x>HX-24&&Math.abs(o.z)<14);lob(S,p,d*(HX-9),(rnd()-.5)*10,.25);S.pk.rc=fo.length?fo[rnd()*fo.length|0].i:-1;return}
if(near<3.4&&rnd()<3*dt*(g.pass*(1-T.ego*.45)+.15)){const m=pick(S,p);if(m){const dist=Math.hypot(m.x-p.x,m.z-p.z);const bl=lane(S,p,m),fw=d*(m.x-p.x);if(dist>26||(bl&&dist>9))lob(S,p,m.x+m.vx*.5,m.z+m.vz*.5,er2(p,'pas'));else if(fw>9&&rnd()<.35+g.risk*.4&&Math.hypot(m.vx,m.vz)>2)kick(S,p,m.x+m.vx*1.1+d*3,m.z+m.vz*1.1,cl(dist*.8+11,13,26),.2,er2(p,'pas'));else kick(S,p,m.x+m.vx*.4,m.z+m.vz*.4,cl(dist*.8+9,11,26),.2,er2(p,'pas'));S.pk.rc=m.i;return}}
if(near<2.4&&g.drib>.5&&p.dash<=0&&rnd()<2*dt*g.drib){skill(p,p.z>no.z?1:-1);S.st[p.s].dr++;return}
let ax=(gx-p.x)/Math.max(8,Math.abs(gx-p.x)),az=-p.z/HZ*.5;for(const o of P)if(o.s!=p.s&&!o.out){const dx=p.x-o.x,dz=p.z-o.z,l=Math.hypot(dx,dz);if(l<7&&l>.1){const w=(7-l)/7*1.8;ax+=dx/l*w;az+=dz/l*w}}tx=p.x+ax*10;tz=p.z+az*10;sp=.95}
