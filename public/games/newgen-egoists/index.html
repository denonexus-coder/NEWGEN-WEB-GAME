<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>NEWGEN · NEWEGOISTS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/game.css">
</head><body>
<canvas id="c"></canvas>

<!-- placar TV (sem barra de velocidade) -->
<div id="sb" style="display:none">
  <button class="hp" data-act="pause" aria-label="Pausar">⏸</button>
  <div class="tv">
    <i id="h-c0"></i><b id="h-a0">---</b>
    <em id="h-s0">0</em><u id="h-t">0:00</u><em id="h-s1">0</em>
    <b id="h-a1">---</b><i id="h-c1"></i>
    <small id="h-half">1º T</small>
    <small id="h-pl" style="display:none"><span id="h-pln"></span> <span id="h-pre"></span></small>
    <span class="lv">● AO VIVO</span>
  </div>
</div>

<div id="toast"></div>
<div id="notif"></div>

<!-- controlos -->
<div id="ctl">
  <div id="js"><div id="kn"></div></div>
  <div class="bt" id="bp">PASSE</div>
  <div class="bt" id="bs">CHUTE</div>
  <div class="bt" id="bd">DRIBLE</div>
  <div class="bt" id="bu">SUB</div>
</div>

<!-- menus -->
<div id="scr"></div>

<!-- pausa -->
<div id="pov" class="ov hidden">
  <div class="ovc">
    <div class="ovk">⏸</div>
    <h2 id="pov-t">PARTIDA PAUSADA</h2>
    <div id="pov-sc" class="ovsc"></div>
    <button class="btn pri big" data-act="resume">▶ Continuar</button>
    <button class="btn" id="pov-exit" data-act="exitmatch">Sair — a partida fica congelada</button>
    <p class="hint">Tudo fica parado até voltares. Nada corre sem ti.</p>
  </div>
</div>

<!-- modal genérico (kickoff / apresentação / forfeit) -->
<div id="modal" class="ov hidden">
  <div class="ovc">
    <div class="ovk" id="md-emoji"></div>
    <h2 id="md-t"></h2>
    <div id="md-b"></div>
    <div id="md-a" class="mdacts"></div>
  </div>
</div>

<script src="../../vendor/three.min.js"></script>
<script src="js/00-names.js"></script>
<script src="js/10-world.js"></script>
<script src="js/20-calendar.js"></script>
<script src="js/30-clock.js"></script>
<script src="js/40-match.js"></script>
<script src="js/50-sim.js"></script>
<script src="js/60-evolve.js"></script>
<script src="js/70-3d.js"></script>
<script src="js/80-controls.js"></script>
<script src="js/90-ui.js"></script>
</body></html>
