name: Build APK (NewGen Launcher)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          # jsdom31 (smoke:game) exige ^22.22.2 || ^24.15.0 || >=26.0.0 —
          # 26 = a mesma versão usada nos testes locais (zlib zstd etc.)
          node-version: 26

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Server tests (sim, física, determinismo, protocolo)
        run: npm run test:server

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Smoke test (worker empacotado)
        run: npm run smoke:worker

      - name: Smoke test (jogo NEWEGOISTS — boot, menu e partida)
        run: npm run smoke:game

      - name: Verify dist files
        run: |
          ls -la dist/
          test -f dist/index.html
          test -f dist/games/newgen-egoists/index.html
          test -f dist/vendor/three.min.js

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # O runner ubuntu-latest já traz o Android SDK pré-instalado
      # (ANDROID_HOME=/usr/local/lib/android/sdk) — nenhum setup extra necessário.

      - name: Create Capacitor Android project
        run: npx cap add android || true

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Lock landscape (sensorLandscape) no AndroidManifest
        run: |
          python3 - <<'EOF'
          import re, sys
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'screenOrientation' in s:
              print('screenOrientation ja definido no manifest — ok')
              sys.exit(0)
          m = re.search(r'<activity[^>]*android:name="\.MainActivity"[^>]*>', s, re.S | re.I)
          if not m:
              print('ERRO: activity .MainActivity nao encontrada no AndroidManifest.xml')
              sys.exit(1)
          tag = m.group(0).replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
          s = s[:m.start()] + tag + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('Manifest travado em sensorLandscape ✓')
          EOF
          grep -q 'android:screenOrientation="sensorLandscape"' android/app/src/main/AndroidManifest.xml
          echo "VERIFICADO: sensorLandscape presente no manifest"

      - name: Build debug APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEWGEN-LAUNCHER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
